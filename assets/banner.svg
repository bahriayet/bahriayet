<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Bahri Muhammad — Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0D1017"/>
      <stop offset="0.55" stop-color="#121018"/>
      <stop offset="1" stop-color="#1B1310"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FF8550"/>
      <stop offset="1" stop-color="#FFC09E"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#F8F4F1" stroke-opacity="0.045" stroke-width="1"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="32"/>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>
  <rect width="1200" height="300" fill="url(#grid)"/>

  <circle cx="1040" cy="40" r="150" fill="#FF8550" opacity="0.16" filter="url(#glow)"/>
  <circle cx="1120" cy="260" r="120" fill="#2747C8" opacity="0.22" filter="url(#glow)"/>

  <path d="M72 84 H300" stroke="url(#accent)" stroke-width="3" stroke-linecap="round"/>

  <text x="72" y="126" fill="#8B8580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" font-weight="600" letter-spacing="6">FULL-STACK DEVELOPER</text>

  <text x="70" y="196" fill="#F8F4F1" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1">BAHRI MUHAMMAD</text>

  <text x="72" y="236" fill="url(#accent)" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="21" font-weight="600">TypeScript · Fastify · PostgreSQL · React</text>

  <text x="72" y="268" fill="#8B8580" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="15" letter-spacing="1.5">MATARAM, INDONESIA</text>
</svg>
