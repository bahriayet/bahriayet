<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-label="Bahri Muhammad — Full-stack developer">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#08080A"/>
      <stop offset="0.5" stop-color="#0E0D10"/>
      <stop offset="1" stop-color="#14110B"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#F7E7B0"/>
      <stop offset="0.28" stop-color="#C9A227"/>
      <stop offset="0.52" stop-color="#F7E7B0"/>
      <stop offset="0.76" stop-color="#A8841C"/>
      <stop offset="1" stop-color="#E8C766"/>
    </linearGradient>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#C9A227" stop-opacity="0"/>
      <stop offset="0.5" stop-color="#C9A227" stop-opacity="0.8"/>
      <stop offset="1" stop-color="#C9A227" stop-opacity="0"/>
    </linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#F5EFE3" stroke-opacity="0.035" stroke-width="1"/>
    </pattern>
    <clipPath id="nameClip">
      <text x="600" y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" letter-spacing="2">BAHRI MUHAMMAD</text>
    </clipPath>

    <style>
      @keyframes shimmer {
        0%   { transform: translateX(-620px); }
        55%  { transform: translateX(620px); }
        100% { transform: translateX(620px); }
      }
      @keyframes float {
        0%, 100% { transform: translateY(0); opacity: 0.18; }
        50%      { transform: translateY(-12px); opacity: 0.75; }
      }
      @keyframes pulse {
        0%, 100% { opacity: 0.25; }
        50%      { opacity: 0.65; }
      }
      @keyframes spin {
        from { transform: rotate(0deg); }
        to   { transform: rotate(360deg); }
      }
      .shimmer { animation: shimmer 7s ease-in-out infinite; }
      .p1  { animation: float 6.0s ease-in-out infinite; }
      .p2  { animation: float 7.5s ease-in-out -1.2s infinite; }
      .p3  { animation: float 5.5s ease-in-out -2.4s infinite; }
      .p4  { animation: float 8.0s ease-in-out -0.8s infinite; }
      .p5  { animation: float 6.8s ease-in-out -3.1s infinite; }
      .p6  { animation: float 7.2s ease-in-out -1.8s infinite; }
      .p7  { animation: float 5.8s ease-in-out -4.0s infinite; }
      .p8  { animation: float 8.4s ease-in-out -2.0s infinite; }
      .p9  { animation: float 6.4s ease-in-out -0.4s infinite; }
      .p10 { animation: float 7.8s ease-in-out -3.6s infinite; }
      .p11 { animation: float 5.2s ease-in-out -1.0s infinite; }
      .p12 { animation: float 7.0s ease-in-out -2.8s infinite; }
      .ring { animation: spin 28s linear infinite; transform-origin: 1044px 84px; }
      .pulse { animation: pulse 5s ease-in-out infinite; }
      @media (prefers-reduced-motion: reduce) {
        .shimmer, .p1, .p2, .p3, .p4, .p5, .p6, .p7, .p8, .p9, .p10, .p11, .p12, .ring, .pulse {
          animation: none !important;
        }
      }
    </style>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <circle cx="200" cy="80" r="240" fill="url(#glow)" opacity="0.45"/>
  <circle cx="1030" cy="260" r="260" fill="url(#glow)" opacity="0.55"/>

  <!-- watermark -->
  <text x="600" y="316" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="230" font-weight="700" fill="#F5EFE3" opacity="0.025" letter-spacing="12">BM</text>

  <!-- frame -->
  <rect x="22" y="22" width="1156" height="276" rx="16" fill="none" stroke="#C9A227" stroke-opacity="0.32" stroke-width="1"/>
  <rect x="30" y="30" width="1140" height="260" rx="12" fill="none" stroke="#C9A227" stroke-opacity="0.10" stroke-width="1"/>

  <!-- corner accents -->
  <g stroke="#C9A227" stroke-width="1.6" stroke-linecap="round" opacity="0.85">
    <path d="M 22 56 L 22 22 L 56 22"/>
    <path d="M 1144 22 L 1178 22 L 1178 56"/>
    <path d="M 22 264 L 22 298 L 56 298"/>
    <path d="M 1144 298 L 1178 298 L 1178 264"/>
  </g>

  <!-- rotating emblem -->
  <g opacity="0.55">
    <circle cx="1044" cy="84" r="30" fill="none" stroke="#C9A227" stroke-opacity="0.35" stroke-width="1"/>
    <circle class="ring" cx="1044" cy="84" r="38" fill="none" stroke="#C9A227" stroke-opacity="0.45" stroke-width="1" stroke-dasharray="2 9"/>
    <text x="1044" y="90" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="17" font-weight="700" fill="#C9A227">BM</text>
  </g>

  <!-- top label -->
  <text x="600" y="100" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="13" font-weight="600" fill="#C9A227" letter-spacing="9">FULL-STACK DEVELOPER</text>

  <!-- name -->
  <text x="600" y="184" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="64" font-weight="700" fill="url(#gold)" letter-spacing="2">BAHRI MUHAMMAD</text>

  <!-- shimmer over name -->
  <g clip-path="url(#nameClip)" opacity="0.55">
    <rect class="shimmer" x="-160" y="110" width="150" height="100" fill="#FFFFFF" opacity="0.55" transform="skewX(-18)"/>
  </g>

  <!-- divider -->
  <rect x="470" y="208" width="260" height="1" fill="url(#line)"/>

  <!-- subtitle -->
  <text x="600" y="238" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="17" font-weight="500" fill="#F5EFE3" opacity="0.88">TypeScript  ·  Fastify  ·  PostgreSQL  ·  React</text>
  <text x="600" y="268" text-anchor="middle" font-family="Inter, 'Segoe UI', Arial, sans-serif" font-size="11" font-weight="500" fill="#B9B3A6" letter-spacing="5">MATARAM, INDONESIA</text>

  <!-- particles -->
  <g fill="#E8C766">
    <circle class="p1"  cx="120" cy="250" r="1.8"/>
    <circle class="p2"  cx="165" cy="140" r="1.4"/>
    <circle class="p3"  cx="245" cy="280" r="1.6"/>
    <circle class="p4"  cx="320" cy="90"  r="1.2"/>
    <circle class="p5"  cx="880" cy="120" r="1.5"/>
    <circle class="p6"  cx="940" cy="250" r="1.8"/>
    <circle class="p7"  cx="1000" cy="190" r="1.3"/>
    <circle class="p8"  cx="1080" cy="170" r="1.6"/>
    <circle class="p9"  cx="1120" cy="250" r="1.2"/>
    <circle class="p10" cx="420" cy="275" r="1.4"/>
    <circle class="p11" cx="760" cy="95"  r="1.5"/>
    <circle class="p12" cx="820" cy="285" r="1.3"/>
  </g>

  <!-- small pulsing dots near the divider -->
  <circle class="pulse" cx="430" cy="208.5" r="2.2" fill="#C9A227"/>
  <circle class="pulse" cx="770" cy="208.5" r="2.2" fill="#C9A227"/>
</svg>
